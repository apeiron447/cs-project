{% extends "base.html" %}
{% block title %}Support - EMS Portal{% endblock %}

{% block layout %}
<div class="centered-layout">
    <div class="centered-card" style="text-align:center;">
        <h1>Contact Support</h1>
        <p class="subtitle">We're here to help</p>

        <p style="color:var(--text-secondary); margin-bottom:20px;">
            If you need any help, feel free to reach out to us at:
        </p>
        <p style="color:var(--red); font-weight:700; font-size:1.1rem; margin-bottom:20px;">
            support@example.com
        </p>
        <p style="color:var(--text-muted); margin-bottom:28px;">
            We will respond within 24 hours.
        </p>
        <a href="{{ url_for('login') }}" class="btn btn-primary">Back to Login</a>
    </div>
</div>
{% endblock %}
